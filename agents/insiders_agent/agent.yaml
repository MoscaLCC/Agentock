name: insiders_agent
kind: script
description: "2.20 — transações de insiders (EUA: SEC Form 4, com cargo e plano 10b5-1; Coreia: DART) em 30/90/180 dias, transações notáveis e um sinal de −2 a +2 com regras explícitas."
inputs: [profile]
cache_ttl: 86400            # 24 h: os relatórios de insiders saem com dias de atraso; a DART é lenta (~100 s)
cache_key: [profile.symbol]
