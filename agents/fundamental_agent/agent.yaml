name: fundamental_agent
description: 2.9 — leitura fundamental (valorização, qualidade, crescimento, risco de balanço) a partir dos dados calculados.
model: claude-sonnet-5-5
max_turns: 6
max_budget_usd: 0.5
inputs: [profile, data]
defaults: {health: null}
tools: []
output: schema.py:FundamentalView
cache_ttl: 43200        # por conteúdo dos dados fundamentais e da saúde
cache_key: [profile.symbol, data, health]
