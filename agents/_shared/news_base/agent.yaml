name: news_base
description: Base dos agentes de notícias 2.1–2.4 (APIs + web, multilíngue). Cada agente define a janela e o foco.
model: claude-sonnet-5-5
max_turns: 25
max_budget_usd: 1.0

inputs: [ticker, hours]
defaults:
  hours: 4
  focus: "notícias de última hora"
  max_items: 10

tools: [WebSearch, WebFetch, Read]
bash: ["python scripts/*"]
market_tools: [news, profile]
hooks: [block_domains]
mcp_servers: {}

output: schema.py:NewsReport
cache_key: [ticker, hours]
